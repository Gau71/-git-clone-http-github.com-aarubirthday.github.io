<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday My Aaru! ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    
    .heart {
      position: absolute;
      bottom: -100px;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.7);
      animation: floatUp 8s linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    
    .card {
      position: relative;
      width: 360px;
      max-width: 90%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(230, 80, 115, 0.3);
      z-index: 10;
      transform: scale(0.9);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: scale(0.92);
      box-shadow: 0 20px 40px rgba(230, 80, 115, 0.4);
    }

    .card h1 {
      font-size: 2rem;
      color: #e63946;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #ff4d6d;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .message {
      font-size: 0.95rem;
      color: #4a4a4a;
      line-height: 1.6;
      margin-bottom: 25px;
      display: none; /* Revealed on click */
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    
    .btn {
      background: linear-gradient(45deg, #ff4d6d, #ff758f);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: linear-gradient(45deg, #ff758f, #ff4d6d);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }
    a{
        text-decoration: none;
        color: white;
    }

    
    .cake-icon {
      font-size: 50px;
      margin-bottom: 15px;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  
  <div id="hearts-container"></div>

  
  <div class="card">
    <div class="cake-icon">🎂</div>
    <h1>Happy Birthday!</h1>
    <p class="subtitle">To My Favorite Person Aaru ❤️</p>

    
    <div class="message" id="secret-message">
      <p>
       Hey ✨ On your special day, I am very happy so i decided to give you the best suprises gift for you then i specially create this suprise only for you so please firstly do start it 💖 .
      </p>
      <br>
      <p><strong><button class="btn" <li><a href="arti2.html" onclick="arti2()">Let's Start 🎁  </a></li></button></strong></p>
    </div>

    
    <button class="btn" id="reveal-btn" onclick="revealWish()">Open Your Surprise 💌</button>
  </div>

  <script>
   
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 5 + 's';
      heart.style.fontSize = Math.random() * 20 + 15 + 'px';
      
      document.getElementById('hearts-container').appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(createHeart, 400);

    
    function revealWish() {
      const msg = document.getElementById('secret-message');
      const btn = document.getElementById('reveal-btn');
      
      msg.style.display = 'block';
      btn.style.display = 'none';

      
      for(let i = 0; i < 20; i++) {
        setTimeout(createHeart, i * 50);
      }
    }
  </script>
</body>
</html>
